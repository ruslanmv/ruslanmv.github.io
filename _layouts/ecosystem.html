---
layout: default
---

<style>
  /* Premium ecosystem visual system. Everything page-specific stays scoped. */
  .ecosystem-page {
    --ecosystem-bg: #070a10;
    --ecosystem-bg-raised: #0c1018;
    --ecosystem-panel: #0f1420;
    --ecosystem-panel-strong: #121827;
    --ecosystem-ink: #f2efe8;
    --ecosystem-muted: #b9bcc7;
    --ecosystem-dim: #7f8595;
    --ecosystem-line: rgba(242, 239, 232, .10);
    --ecosystem-line-strong: rgba(242, 239, 232, .20);
    --ecosystem-violet: #a394ff;
    --ecosystem-blue: #7d97ff;
    --ecosystem-cyan: #6fd3f2;
    --ecosystem-amber: #e6b26a;
    --ecosystem-green: #74cf9a;
    --ecosystem-rose: #d79ad8;
    --ecosystem-serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --ecosystem-sans: Inter, "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --ecosystem-mono: "SFMono-Regular", "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --ecosystem-radius-lg: 24px;
    --ecosystem-radius-md: 15px;
    --ecosystem-shadow-sm: 0 14px 40px rgba(0, 0, 0, .18);
    --ecosystem-shadow-md: 0 28px 76px rgba(0, 0, 0, .28);
    --ecosystem-shadow-lg: 0 42px 120px rgba(0, 0, 0, .36);
    --ecosystem-ease: cubic-bezier(.22, 1, .36, 1);
    position: relative;
    isolation: isolate;
    overflow: clip;
    min-height: 100vh;
    color: var(--ecosystem-ink);
    background:
      radial-gradient(900px 560px at 92% 3%, rgba(163, 148, 255, .09), transparent 69%),
      radial-gradient(760px 520px at 3% 26%, rgba(111, 211, 242, .055), transparent 72%),
      var(--ecosystem-bg);
    font-family: var(--ecosystem-sans);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .ecosystem-page *, .ecosystem-page *::before, .ecosystem-page *::after { box-sizing: border-box; }
  .ecosystem-page > * { position: relative; z-index: 1; }
  .ecosystem-page::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .36;
    background-image:
      linear-gradient(rgba(242, 239, 232, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242, 239, 232, .035) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(72% 34% at 70% 8%, #000 8%, transparent 100%);
    -webkit-mask-image: radial-gradient(72% 34% at 70% 8%, #000 8%, transparent 100%);
  }
  /* Film grain. Tiled at its natural 180px so the browser rasterises the
     turbulence filter once instead of stretching it across the full page
     height, and limited to pointer devices — on phones the blend mode forced
     the whole (very tall) page into one composited layer for an effect that is
     invisible at that pixel density. */
  @media (min-width: 901px) {
    .ecosystem-page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .10;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      background-repeat: repeat;
      mix-blend-mode: soft-light;
    }
  }
  .ecosystem-page ::selection { background: rgba(163, 148, 255, .30); color: #fff; }
  .ecosystem-page a { color: inherit; }
  .ecosystem-page a:focus-visible, .ecosystem-page button:focus-visible {
    outline: 2px solid var(--ecosystem-cyan);
    outline-offset: 4px;
    border-radius: 6px;
  }

  .ecosystem-shell { width: min(1180px, calc(100% - 2 * clamp(20px, 5vw, 56px))); margin-inline: auto; }

  /* ---- Guided tour: the host page's side of the contract ----------------
     The component owns the launcher, player and rail; the page owns the space
     they need. The launch row keeps its height after the launcher hides, so
     starting the tour never reflows the hero. */
  .ecosystem-tour-launch { margin: 34px 0 18px; min-height: 68px; display: flex; align-items: center; }
  .ecosystem-tour-launch + .ecosystem-buttons { margin-top: 0; }
  @media (max-width: 650px) { .ecosystem-tour-launch { margin: 26px 0 14px; } }

  /* Nothing may become unreachable because the player is sitting over it: the
     mini-player's strip at the bottom, and the chapter rail's closed hairline
     on the right, are reserved while the tour is running. The chapter drawer
     itself is a menu — it slides over the page rather than reflowing it. */
  body.gt-active .ecosystem-page { padding-bottom: 96px; }
  @media (min-width: 1280px) {
    body.gt-active .ecosystem-page {
      padding-right: var(--gt-rail-width, 46px);
      transition: padding-right .4s var(--ecosystem-ease);
    }
  }
  /* every section must know its real height for the auto-scroll to land */
  body.gt-active .ecosystem-section { content-visibility: visible; }

  /* The page is a dozen tall sections of gradients, blurred shadows and blend
     layers, and the hero (which is not an .ecosystem-section) is the only part
     that has to render immediately. The rest are skipped until they approach
     the viewport.

     The placeholder is a content-box height — section padding is added on top —
     set to the measured mean (≈700px desktop, ≈1070px mobile) so the estimated
     page height lands close to the real one; `auto` then lets each section
     remember its true height once rendered, so the scrollbar stays steady. */
  .ecosystem-section {
    position: relative;
    padding: clamp(88px, 11vw, 148px) 0;
    content-visibility: auto;
    contain-intrinsic-size: auto 700px;
  }
  /* Skipped sections must still appear on paper. */
  @media print {
    .ecosystem-section { content-visibility: visible; }
  }
  .ecosystem-section + .ecosystem-section { border-top: 1px solid var(--ecosystem-line); }
  .ecosystem-section + .ecosystem-section::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 50%;
    width: min(760px, 72vw);
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(163, 148, 255, .18), transparent);
  }

  .ecosystem-kicker {
    margin: 0 0 18px;
    color: var(--ecosystem-dim);
    font-size: 12px;
    font-weight: 650;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .ecosystem-kicker::before {
    content: "";
    display: inline-block;
    width: 22px;
    height: 1px;
    margin-right: 12px;
    vertical-align: middle;
    background: var(--ecosystem-violet);
    box-shadow: 0 0 12px rgba(163, 148, 255, .40);
  }
  .ecosystem-title, .ecosystem-heading {
    margin: 0;
    color: var(--ecosystem-ink);
    font-family: var(--ecosystem-serif);
    font-weight: 400;
    text-wrap: balance;
  }
  .ecosystem-title {
    max-width: 860px;
    margin-bottom: 28px;
    font-size: clamp(42px, 5.8vw, 76px);
    line-height: 1.01;
    letter-spacing: -.028em;
  }
  .ecosystem-heading {
    max-width: 800px;
    margin-bottom: 24px;
    font-size: clamp(34px, 4.6vw, 58px);
    line-height: 1.07;
    letter-spacing: -.02em;
  }
  .ecosystem-lede { max-width: 70ch; margin: 0; color: var(--ecosystem-muted); font-size: clamp(18px, 1.55vw, 21px); }
  .ecosystem-emphasis { color: var(--ecosystem-ink); font-weight: 550; }

  /* Hero */
  .ecosystem-hero {
    position: relative;
    min-height: min(860px, calc(100svh - 70px));
    display: grid;
    align-items: center;
    padding: clamp(72px, 8vw, 112px) 0 clamp(82px, 9vw, 120px);
  }
  .ecosystem-hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(58% 52% at calc(78% + var(--hero-x, 0px)) calc(30% + var(--hero-y, 0px)), rgba(163, 148, 255, .18), transparent 70%),
      radial-gradient(42% 38% at 16% 92%, rgba(111, 211, 242, .07), transparent 72%);
  }
  .ecosystem-hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr); gap: clamp(40px, 6vw, 78px); align-items: center; }
  .ecosystem-hero .ecosystem-title span {
    display: block;
    font-style: italic;
    color: transparent;
    background: linear-gradient(112deg, var(--ecosystem-muted) 5%, #fff 48%, var(--ecosystem-violet) 94%);
    background-size: 220% 100%;
    background-position: 0 50%;
    -webkit-background-clip: text;
    background-clip: text;
  }
  @media (prefers-reduced-motion: no-preference) {
    .ecosystem-hero .ecosystem-title span { animation: ecosystem-shimmer 10s ease-in-out infinite; }
    @keyframes ecosystem-shimmer { 0%, 70%, 100% { background-position: 0 50%; } 84% { background-position: 100% 50%; } }
  }

  .ecosystem-buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .ecosystem-button {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    padding: 0 22px;
    border: 1px solid var(--ecosystem-line-strong);
    border-radius: 999px;
    color: var(--ecosystem-ink) !important;
    background: rgba(255, 255, 255, .012);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
    font-size: 14px;
    font-weight: 650;
    letter-spacing: .01em;
    text-decoration: none !important;
    transition: transform .32s var(--ecosystem-ease), border-color .25s ease, background .25s ease, box-shadow .32s ease;
  }
  .ecosystem-button::before {
    content: "";
    position: absolute;
    inset: -1px;
    z-index: -1;
    opacity: 0;
    background: radial-gradient(180px circle at var(--button-x, 50%) var(--button-y, 0%), rgba(255, 255, 255, .16), transparent 62%);
    transition: opacity .25s ease;
  }
  .ecosystem-button:hover { transform: translateY(-2px); border-color: var(--ecosystem-violet); box-shadow: 0 12px 34px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .07); }
  .ecosystem-button:hover::before { opacity: 1; }
  .ecosystem-button--primary { border-color: var(--ecosystem-ink); background: var(--ecosystem-ink); color: #0a0d13 !important; box-shadow: 0 12px 36px rgba(242, 239, 232, .08); }
  .ecosystem-button--primary:hover { border-color: #fff; background: #fff; box-shadow: 0 18px 46px rgba(242, 239, 232, .13); }

  /* Secondary navigation, not a call to action: dark glass, muted text, and a
     trailing arrow. Used in the hero, where the guided tour is the primary
     action and these must not compete with it or with the headline. */
  .ecosystem-button--quiet {
    justify-content: space-between;
    gap: 24px;
    min-height: 56px;
    min-width: 255px;
    padding: 0 26px;
    border-color: rgba(255, 255, 255, .16);
    background: rgba(13, 18, 29, .48);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: rgba(235, 238, 245, .66) !important;
    font-size: 15px;
    font-weight: 500;
    box-shadow: none;
  }
  .ecosystem-button--quiet::before { display: none; }   /* no spotlight glow */
  .ecosystem-button--quiet:hover {
    transform: none;
    border-color: rgba(255, 255, 255, .26);
    background: rgba(255, 255, 255, .045);
    color: rgba(255, 255, 255, .9) !important;
    box-shadow: none;
  }
  .ecosystem-button__arrow { flex: 0 0 auto; font-size: 16px; line-height: 1; opacity: .7; transition: transform .3s var(--ecosystem-ease), opacity .3s ease; }
  .ecosystem-button--quiet:hover .ecosystem-button__arrow { transform: translateX(3px); opacity: 1; }

  /* Animated hero network */
  .ecosystem-network {
    position: relative;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 1px solid rgba(242, 239, 232, .13);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 48%, rgba(163, 148, 255, .14), transparent 39%),
      radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .02), transparent 62%);
    box-shadow: inset 0 0 70px rgba(163, 148, 255, .035), 0 42px 100px rgba(0, 0, 0, .25);
    transform: perspective(1100px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
    transform-style: preserve-3d;
    transition: transform .65s var(--ecosystem-ease), border-color .3s ease;
  }
  .ecosystem-network::before, .ecosystem-network::after {
    content: "";
    position: absolute;
    border-radius: inherit;
    pointer-events: none;
  }
  .ecosystem-network::before { inset: 12%; border: 1px dashed rgba(242, 239, 232, .13); }
  .ecosystem-network::after { inset: 28%; border: 1px solid rgba(163, 148, 255, .32); box-shadow: 0 0 36px rgba(163, 148, 255, .06); }
  @media (prefers-reduced-motion: no-preference) {
    .ecosystem-network::before { animation: ecosystem-spin 28s linear infinite; }
    .ecosystem-network::after { animation: ecosystem-pulse 5.5s ease-in-out infinite; }
    @keyframes ecosystem-spin { to { transform: rotate(360deg); } }
    @keyframes ecosystem-pulse { 50% { transform: scale(1.055); opacity: .62; } }
  }
  .ecosystem-network-core {
    position: relative;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 34%;
    aspect-ratio: 1;
    border: 1px solid rgba(163, 148, 255, .72);
    border-radius: 50%;
    background: linear-gradient(145deg, #171c30, #0f1322);
    box-shadow: 0 0 0 9px rgba(163, 148, 255, .035), 0 0 58px rgba(163, 148, 255, .18), inset 0 1px 0 rgba(255, 255, 255, .05);
    text-align: center;
  }
  .ecosystem-network-core::after {
    content: "";
    position: absolute;
    inset: -20%;
    border: 1px dotted rgba(163, 148, 255, .27);
    border-radius: 50%;
  }
  @media (prefers-reduced-motion: no-preference) { .ecosystem-network-core::after { animation: ecosystem-spin 18s linear infinite reverse; } }
  .ecosystem-network-core strong { display: block; color: var(--ecosystem-ink); font-size: 15px; font-weight: 650; }
  .ecosystem-network-core small { display: block; margin-top: 4px; color: var(--ecosystem-violet); font-size: 10px; letter-spacing: .17em; }
  .ecosystem-satellite {
    position: absolute;
    z-index: 4;
    padding: 8px 12px;
    border: 1px solid var(--ecosystem-line-strong);
    border-radius: 999px;
    color: var(--ecosystem-muted);
    background: rgba(12, 16, 24, .86);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .035);
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .09em;
    text-transform: uppercase;
    transition: transform .3s var(--ecosystem-ease), border-color .3s ease, color .3s ease, box-shadow .3s ease;
  }
  .ecosystem-satellite::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; vertical-align: 1px; }
  .ecosystem-satellite--one { top: 7%; color: var(--ecosystem-blue); }
  .ecosystem-satellite--two { right: -3%; top: 44%; color: var(--ecosystem-rose); }
  .ecosystem-satellite--three { bottom: 7%; color: var(--ecosystem-cyan); }
  .ecosystem-satellite--four { left: -3%; top: 44%; color: var(--ecosystem-green); }
  .ecosystem-satellite:hover { transform: translateY(-3px) scale(1.02); border-color: currentColor; box-shadow: 0 16px 38px rgba(0, 0, 0, .24), 0 0 24px color-mix(in srgb, currentColor 15%, transparent); }
  /* The frosted-glass pass is expensive on mobile GPUs and barely reads against
     an almost-opaque chip on a dark page, so it is desktop-only. */
  @media (min-width: 901px) {
    .ecosystem-satellite { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  }

  /* Problems and architecture */
  .ecosystem-problem-grid, .ecosystem-principles, .ecosystem-projects { display: grid; gap: 16px; margin-top: 48px; }
  .ecosystem-problem-grid { grid-template-columns: repeat(2, 1fr); }
  .ecosystem-problem {
    position: relative;
    overflow: hidden;
    padding: 22px 24px;
    border: 1px solid var(--ecosystem-line);
    border-radius: var(--ecosystem-radius-md);
    background: linear-gradient(145deg, rgba(255, 255, 255, .025), rgba(255, 255, 255, .008));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .022);
  }
  .ecosystem-problem span { display: block; color: var(--ecosystem-dim); font-size: 14px; }
  .ecosystem-problem strong { color: var(--ecosystem-ink); font-size: 17px; font-weight: 600; }
  .ecosystem-quote { max-width: 920px; margin: 62px 0 0; color: var(--ecosystem-ink); font-family: var(--ecosystem-serif); font-size: clamp(26px, 3.5vw, 46px); line-height: 1.16; letter-spacing: -.015em; }

  .ecosystem-architecture {
    position: relative;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: auto 82px auto 82px auto;
    margin-top: 64px;
    padding: clamp(18px, 3vw, 38px);
    border: 1px solid var(--ecosystem-line);
    border-radius: var(--ecosystem-radius-lg);
    background: radial-gradient(60% 56% at 50% 31%, rgba(163, 148, 255, .10), transparent 72%), var(--ecosystem-bg-raised);
    box-shadow: var(--ecosystem-shadow-md), inset 0 1px 0 rgba(255, 255, 255, .025);
  }
  .ecosystem-architecture::before {
    content: "";
    position: absolute;
    inset: 108px 20% 108px;
    background:
      linear-gradient(var(--ecosystem-line-strong), var(--ecosystem-line-strong)) center / 1px 100% no-repeat,
      linear-gradient(90deg, var(--ecosystem-line-strong), var(--ecosystem-line-strong)) center 29% / 68% 1px no-repeat,
      linear-gradient(90deg, var(--ecosystem-line-strong), var(--ecosystem-line-strong)) center 79% / 68% 1px no-repeat;
    opacity: .72;
  }
  .ecosystem-node {
    --node-color: var(--ecosystem-violet);
    position: relative;
    z-index: 2;
    min-height: 142px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    border: 1px solid var(--ecosystem-line-strong);
    border-radius: 18px;
    background: linear-gradient(145deg, rgba(255, 255, 255, .038), rgba(255, 255, 255, .01)), var(--ecosystem-panel);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .16), inset 0 1px 0 rgba(255, 255, 255, .025);
    transition: transform .38s var(--ecosystem-ease), border-color .3s ease, box-shadow .38s ease;
  }
  .ecosystem-node::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(330px circle at var(--spot-x, 50%) var(--spot-y, 50%), color-mix(in srgb, var(--node-color) 13%, transparent), transparent 58%);
    transition: opacity .3s ease;
  }
  .ecosystem-node:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--node-color) 70%, transparent); box-shadow: 0 26px 62px rgba(0, 0, 0, .28), 0 0 28px color-mix(in srgb, var(--node-color) 8%, transparent); }
  .ecosystem-node:hover::after { opacity: 1; }
  .ecosystem-node small { color: var(--node-color); font-size: 10px; font-weight: 650; letter-spacing: .16em; }
  .ecosystem-node strong { color: var(--ecosystem-ink); font-family: var(--ecosystem-serif); font-size: 25px; font-weight: 400; }
  .ecosystem-node span { color: var(--ecosystem-dim); font-size: 13px; }
  .ecosystem-node--home { --node-color: var(--ecosystem-violet); grid-column: 5 / 9; grid-row: 1; text-align: center; border-color: rgba(163, 148, 255, .54); background: linear-gradient(145deg, rgba(163, 148, 255, .08), rgba(255, 255, 255, .01)), #121728; }
  .ecosystem-node--day { --node-color: var(--ecosystem-blue); grid-column: 2 / 6; grid-row: 3; }
  .ecosystem-node--avatar { --node-color: var(--ecosystem-amber); grid-column: 8 / 12; grid-row: 3; }
  .ecosystem-node--olla { --node-color: var(--ecosystem-cyan); grid-column: 2 / 6; grid-row: 5; }
  .ecosystem-node--git { --node-color: var(--ecosystem-green); grid-column: 8 / 12; grid-row: 5; }
  .ecosystem-architecture-note { position: absolute; z-index: 3; left: 50%; top: 63%; transform: translate(-50%, -50%); padding: 4px 12px; color: var(--ecosystem-dim); background: var(--ecosystem-bg-raised); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

  /* Surfaces and timeline */
  .ecosystem-surfaces { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(48px, 7vw, 90px); align-items: start; }
  .ecosystem-surface-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--ecosystem-line); }
  .ecosystem-surface-list li { display: grid; grid-template-columns: 130px 1fr; gap: 22px; padding: 20px 0; border-bottom: 1px solid var(--ecosystem-line); transition: padding-left .35s var(--ecosystem-ease), background .3s ease; }
  .ecosystem-surface-list li:hover { padding-left: 10px; }
  .ecosystem-surface-list strong { color: var(--ecosystem-ink); font-weight: 600; }
  .ecosystem-surface-list span { color: var(--ecosystem-muted); }

  .ecosystem-timeline { position: relative; margin-top: 56px; padding-left: 100px; }
  .ecosystem-timeline::before { content: ""; position: absolute; left: 63px; top: 10px; bottom: 10px; width: 1px; background: linear-gradient(var(--ecosystem-blue), var(--ecosystem-violet) 48%, var(--ecosystem-amber)); opacity: .68; }
  .ecosystem-moment { position: relative; display: grid; grid-template-columns: minmax(110px, .55fr) 2fr; gap: 34px; padding: 0 0 44px; }
  .ecosystem-moment::before { content: ""; position: absolute; left: -42px; top: 8px; width: 10px; height: 10px; border: 2px solid var(--ecosystem-violet); border-radius: 50%; background: var(--ecosystem-bg); transition: transform .3s var(--ecosystem-ease), box-shadow .3s ease; }
  .ecosystem-moment:hover::before { transform: scale(1.25); box-shadow: 0 0 18px rgba(163, 148, 255, .5); }
  .ecosystem-time { color: var(--ecosystem-dim); font-family: var(--ecosystem-mono); font-size: 13px; }

<script>
(function () {
  var page = document.querySelector('.ecosystem-page');
  if (!page) return;

  var root = document.documentElement;
  root.classList.add('ecosystem-js');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var progress = document.querySelector('.ecosystem-scroll-progress');
  var hero = page.querySelector('.ecosystem-hero');
  var network = page.querySelector('.ecosystem-network');
  var ticking = false;

  // scrollHeight is a layout-forcing read. Measuring it inside the scroll
  // handler made every scroll frame flush layout; it is cached instead and
  // refreshed only when something can actually have changed the page height.
  // The document height does drift while reading — reveal transitions land and
  // off-screen sections resolve their real height — so it cannot be measured
  // once. But it must not be measured every frame either. It is refreshed at
  // most a few times a second, from inside the same frame callback that writes
  // the bar, which keeps it to one layout flush rather than one per scroll event.
  var scrollMax = 1;
  var lastMeasured = 0;
  var MEASURE_INTERVAL = 400;
  function syncScroll() {
    ticking = false;
    var now = performance.now();
    if (now - lastMeasured > MEASURE_INTERVAL) {
      lastMeasured = now;
      scrollMax = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    }
    var value = Math.max(0, Math.min(1, window.scrollY / scrollMax));
    if (progress) progress.style.setProperty('--ecosystem-progress', value.toFixed(4));
  }
  function requestSync() {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(syncScroll);
    }
  }
  syncScroll();
  window.addEventListener('scroll', requestSync, { passive: true });
  window.addEventListener('resize', function () {
    lastMeasured = 0;
    requestSync();
  }, { passive: true });

  var selectors = [
    '.ecosystem-section > .ecosystem-shell > .ecosystem-kicker',
    '.ecosystem-section .ecosystem-heading',
    '.ecosystem-problem',
    '.ecosystem-architecture',
    '.ecosystem-surface-list li',
    '.ecosystem-moment',
    '.ecosystem-dialogue',
    '.ecosystem-build-flow',
    '.ecosystem-compute',
    '.ecosystem-principle',
    '.ecosystem-solution',
    '.ecosystem-project',
    '.ecosystem-beliefs li',
    '.ecosystem-stage',
    '.ecosystem-repo-links a',
    '.ecosystem-final .ecosystem-lede',
    '.ecosystem-final .ecosystem-buttons'
  ];
  var reveal = Array.prototype.slice.call(page.querySelectorAll(selectors.join(',')));
  reveal.forEach(function (el, index) {
    el.classList.add('ecosystem-reveal');
    el.style.setProperty('--reveal-delay', ((index % 5) * 55) + 'ms');
  });

  if (reduceMotion || !('IntersectionObserver' in window)) {
    reveal.forEach(function (el) { el.classList.add('is-visible'); });
  } else {
    var observer = new IntersectionObserver(function (entries, instance) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        instance.unobserve(entry.target);
      });
    }, { threshold: .08, rootMargin: '0px 0px -7% 0px' });
    reveal.forEach(function (el) { observer.observe(el); });

    // Park the hero's infinite animations while the hero is off-screen.
    if (hero) {
      new IntersectionObserver(function (entries) {
        page.classList.toggle('is-hero-offscreen', !entries[0].isIntersecting);
      }, { rootMargin: '120px' }).observe(hero);
    }
  }

  if (!finePointer || reduceMotion) return;

  // Pointer moves arrive far faster than the screen refreshes. Coalescing the
  // custom-property writes into one per frame keeps a single style recalc and
  // paint per frame instead of one per event.
  function onFrame(handler) {
    var pending = null;
    var scheduled = false;
    return function (event) {
      pending = event;
      if (scheduled) return;
      scheduled = true;
      window.requestAnimationFrame(function () {
        scheduled = false;
        handler(pending);
      });
    };
  }

  var surfaces = page.querySelectorAll('.ecosystem-project, .ecosystem-node, .ecosystem-problem, .ecosystem-solution, .ecosystem-dialogue, .ecosystem-repo-links a');
  surfaces.forEach(function (el) {
    el.addEventListener('pointermove', onFrame(function (event) {
      var rect = el.getBoundingClientRect();
      el.style.setProperty('--spot-x', (event.clientX - rect.left) + 'px');
      el.style.setProperty('--spot-y', (event.clientY - rect.top) + 'px');
    }), { passive: true });
  });

  page.querySelectorAll('.ecosystem-button').forEach(function (button) {
    button.addEventListener('pointermove', onFrame(function (event) {
      var rect = button.getBoundingClientRect();
      button.style.setProperty('--button-x', (event.clientX - rect.left) + 'px');
      button.style.setProperty('--button-y', (event.clientY - rect.top) + 'px');
    }), { passive: true });
  });

  if (hero && network) {
    hero.addEventListener('pointermove', onFrame(function (event) {
      var rect = hero.getBoundingClientRect();
      var nx = ((event.clientX - rect.left) / rect.width) - .5;
      var ny = ((event.clientY - rect.top) / rect.height) - .5;
      network.style.setProperty('--tilt-y', (nx * 4.8).toFixed(2) + 'deg');
      network.style.setProperty('--tilt-x', (-ny * 3.6).toFixed(2) + 'deg');
      hero.style.setProperty('--hero-x', (nx * 16).toFixed(1) + 'px');
      hero.style.setProperty('--hero-y', (ny * 12).toFixed(1) + 'px');
    }), { passive: true });
    hero.addEventListener('pointerleave', function () {
      network.style.setProperty('--tilt-y', '0deg');
      network.style.setProperty('--tilt-x', '0deg');
      hero.style.setProperty('--hero-x', '0px');
      hero.style.setProperty('--hero-y', '0px');
    }, { passive: true });
  }
})();
</script>
