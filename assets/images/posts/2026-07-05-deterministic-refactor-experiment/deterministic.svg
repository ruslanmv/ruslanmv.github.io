<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" font-family="'Hanken Grotesk',system-ui,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062315"/><stop offset="1" stop-color="#02170f"/>
    </linearGradient>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#53f39d" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="480" rx="22" fill="url(#bg)"/>
  <text x="48" y="66" fill="#53f39d" font-size="15" font-family="monospace" letter-spacing="2">DETERMINISTIC REFACTOR · UNDER CONTRACT</text>
  <text x="48" y="112" fill="#eafff4" font-size="34" font-weight="800">10,000 lines in. Bounded autonomy out.</text>

  <!-- messy legacy blob -->
  <g>
    <rect x="60" y="170" width="230" height="220" rx="16" fill="#0a2a1d" stroke="rgba(200,120,120,.45)"/>
    <text x="175" y="205" text-anchor="middle" fill="#ff8f7a" font-size="17" font-weight="700">legacy-source/</text>
    <path d="M84,232 C140,224 150,268 200,250 C250,232 236,286 268,270" fill="none" stroke="#ff8f7a" stroke-width="2" opacity=".7"/>
    <path d="M84,266 C150,258 132,300 210,286 C258,278 244,320 268,304" fill="none" stroke="#ffb37a" stroke-width="2" opacity=".6"/>
    <path d="M84,300 C120,294 160,332 214,316 C250,306 250,346 268,338" fill="none" stroke="#ff8f7a" stroke-width="2" opacity=".5"/>
    <text x="175" y="372" text-anchor="middle" fill="#9cc7b3" font-size="12" font-family="monospace">2,014-line app.py · 0 tests · CC grade F</text>
  </g>

  <!-- contract gate -->
  <g>
    <rect x="410" y="200" width="200" height="160" rx="16" fill="#0d3524" stroke="rgba(120,200,160,.55)"/>
    <text x="510" y="236" text-anchor="middle" fill="#53f39d" font-size="17" font-weight="700">.mb/contract</text>
    <text x="510" y="266" text-anchor="middle" fill="#bfe9d3" font-size="12" font-family="monospace">protected_paths</text>
    <text x="510" y="288" text-anchor="middle" fill="#bfe9d3" font-size="12" font-family="monospace">coverage ≥ 90%</text>
    <text x="510" y="310" text-anchor="middle" fill="#bfe9d3" font-size="12" font-family="monospace">dep allowlist</text>
    <text x="510" y="338" text-anchor="middle" fill="#7dffd0" font-size="12" font-family="monospace">fail-closed</text>
  </g>
  <line x1="292" y1="280" x2="406" y2="280" stroke="#53f39d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 agents -->
  <g font-family="monospace">
    <line x1="612" y1="280" x2="726" y2="280" stroke="#53f39d" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="730" y="176" width="160" height="46" rx="10" fill="#0a2a1d" stroke="rgba(120,200,160,.35)"/>
    <text x="810" y="204" text-anchor="middle" fill="#eafff4" font-size="14">Explorer</text>
    <rect x="730" y="230" width="160" height="46" rx="10" fill="#0a2a1d" stroke="rgba(120,200,160,.35)"/>
    <text x="810" y="258" text-anchor="middle" fill="#eafff4" font-size="14">Planner</text>
    <rect x="730" y="284" width="160" height="46" rx="10" fill="#0a2a1d" stroke="rgba(120,200,160,.35)"/>
    <text x="810" y="312" text-anchor="middle" fill="#eafff4" font-size="14">Coder</text>
    <rect x="730" y="338" width="160" height="46" rx="10" fill="#0a2a1d" stroke="rgba(120,200,160,.35)"/>
    <text x="810" y="366" text-anchor="middle" fill="#eafff4" font-size="14">Reviewer</text>
  </g>

  <!-- clean result -->
  <g>
    <line x1="892" y1="280" x2="1006" y2="280" stroke="#53f39d" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="1010" y="200" width="110" height="160" rx="14" fill="#0d3524" stroke="rgba(120,200,160,.55)"/>
    <text x="1065" y="248" text-anchor="middle" fill="#7dffd0" font-size="30" font-weight="800">15</text>
    <text x="1065" y="272" text-anchor="middle" fill="#bfe9d3" font-size="11" font-family="monospace">batches</text>
    <text x="1065" y="308" text-anchor="middle" fill="#7dffd0" font-size="30" font-weight="800">0</text>
    <text x="1065" y="332" text-anchor="middle" fill="#bfe9d3" font-size="11" font-family="monospace">regressions</text>
  </g>

  <text x="48" y="446" fill="#7fb8a0" font-size="14" font-family="monospace">22:14 → 06:41 · 4-core CPU · 214/214 golden requests matched · $0.00</text>
