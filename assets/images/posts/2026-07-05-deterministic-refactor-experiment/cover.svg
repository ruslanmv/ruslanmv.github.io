<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Abstract: tangled chaos passing through a gate into an ordered grid of modules">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06271a"/><stop offset="1" stop-color="#02150e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#0c3a27" stop-opacity=".9"/>
      <stop offset="1" stop-color="#02150e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd996"/><stop offset="1" stop-color="#15a86d"/>
    </linearGradient>
    <linearGradient id="mod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3b28"/><stop offset="1" stop-color="#0a2c1e"/>
    </linearGradient>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="7" refY="5.5" orient="auto">
      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#53f39d" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- LEFT: chaos -->
  <g>
    <rect x="70" y="150" width="330" height="330" rx="22" fill="#1a0f0d" stroke="#7a2f27" stroke-opacity=".55"/>
    <g fill="none" stroke-linecap="round">
      <path d="M110,210 C210,180 190,300 300,250 C360,222 330,320 360,300" stroke="#ff8f7a" stroke-width="5" opacity=".85"/>
      <path d="M105,260 C200,250 175,360 320,315 C370,300 345,378 362,360" stroke="#ffb37a" stroke-width="5" opacity=".7"/>
      <path d="M112,318 C185,300 250,405 335,368 C368,352 355,415 360,410" stroke="#ff8f7a" stroke-width="5" opacity=".6"/>
      <path d="M108,372 C190,372 210,430 330,415" stroke="#ffcf8f" stroke-width="4" opacity=".5"/>
      <path d="M120,420 C200,410 260,452 348,438" stroke="#ff8f7a" stroke-width="4" opacity=".45"/>
    </g>
    <g fill="#ff8f7a">
      <circle cx="150" cy="200" r="6" opacity=".9"/><circle cx="330" cy="215" r="5" opacity=".7"/>
      <circle cx="140" cy="450" r="5" opacity=".6"/><circle cx="355" cy="405" r="6" opacity=".8"/>
    </g>
  </g>

  <!-- flow into gate -->
  <line x1="408" y1="315" x2="486" y2="315" stroke="#53f39d" stroke-width="3" marker-end="url(#ar)" opacity=".9"/>

  <!-- CENTER: the gate / funnel -->
  <g>
    <path d="M500,168 L700,232 L700,398 L500,462 Z" fill="url(#gate)" opacity=".16"/>
    <path d="M500,168 L700,232 L700,398 L500,462 Z" fill="none" stroke="url(#gate)" stroke-width="3"/>
    <rect x="556" y="286" width="92" height="58" rx="12" fill="#062b1c" stroke="#2fd996" stroke-width="2.5"/>
    <path d="M576,315 l14,14 l26,-30" fill="none" stroke="#53f39d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#2fd996" stroke-width="2" opacity=".5">
      <line x1="512" y1="210" x2="690" y2="256"/>
      <line x1="512" y1="420" x2="690" y2="374"/>
    </g>
  </g>

  <!-- flow into order -->
  <line x1="712" y1="315" x2="790" y2="315" stroke="#53f39d" stroke-width="3" marker-end="url(#ar)" opacity=".9"/>

  <!-- RIGHT: ordered modular grid -->
  <g>
    <rect x="810" y="150" width="330" height="330" rx="22" fill="#082217" stroke="#1c5c3e" stroke-opacity=".7"/>
    <g>
      <!-- 3 columns x 4 rows of tidy modules -->
      <g fill="url(#mod)" stroke="#2fd996" stroke-opacity=".55" stroke-width="1.5">
        <rect x="838" y="176" width="86" height="66" rx="10"/><rect x="957" y="176" width="86" height="66" rx="10"/><rect x="1057" y="176" width="60" height="66" rx="10"/>
        <rect x="838" y="256" width="86" height="66" rx="10"/><rect x="957" y="256" width="86" height="66" rx="10"/><rect x="1057" y="256" width="60" height="66" rx="10"/>
        <rect x="838" y="336" width="86" height="66" rx="10"/><rect x="957" y="336" width="86" height="66" rx="10"/><rect x="1057" y="336" width="60" height="66" rx="10"/>
        <rect x="838" y="416" width="86" height="52" rx="10"/><rect x="957" y="416" width="86" height="52" rx="10"/><rect x="1057" y="416" width="60" height="52" rx="10"/>
      </g>
      <!-- module "content" bars + status dots -->
      <g fill="#53f39d" opacity=".85">
        <circle cx="853" cy="192" r="4"/><circle cx="972" cy="192" r="4"/><circle cx="1072" cy="192" r="4"/>
        <circle cx="853" cy="272" r="4"/><circle cx="972" cy="272" r="4"/><circle cx="1072" cy="272" r="4"/>
        <circle cx="853" cy="352" r="4"/><circle cx="972" cy="352" r="4"/><circle cx="1072" cy="352" r="4"/>
      </g>
      <g stroke="#2fd996" stroke-width="3" opacity=".35" stroke-linecap="round">
        <line x1="852" y1="216" x2="908" y2="216"/><line x1="971" y1="216" x2="1027" y2="216"/>
        <line x1="852" y1="296" x2="908" y2="296"/><line x1="971" y1="296" x2="1027" y2="296"/>
        <line x1="852" y1="376" x2="908" y2="376"/><line x1="971" y1="376" x2="1027" y2="376"/>
      </g>
    </g>
  </g>
</svg>
