<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" font-family="'Hanken Grotesk',system-ui,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062315"/><stop offset="1" stop-color="#02170f"/>
    </linearGradient>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#53f39d" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="480" rx="22" fill="url(#bg)"/>
  <text x="48" y="66" fill="#53f39d" font-size="15" font-family="monospace" letter-spacing="2">$0 AI SOFTWARE HOUSE · ON A $35 PI</text>
  <text x="48" y="112" fill="#eafff4" font-size="34" font-weight="800">Four agents. One tiny board. No cloud.</text>

  <!-- board boundary -->
  <rect x="48" y="150" width="1064" height="230" rx="18" fill="none" stroke="rgba(120,200,160,.30)" stroke-dasharray="6 6"/>
  <text x="70" y="180" fill="#7fb8a0" font-size="13" font-family="monospace">RASPBERRY PI 4 · 4 CORES · 4 GB · NO GPU · NO API KEYS</text>

  <!-- Ollama -->
  <g>
    <rect x="80" y="210" width="220" height="140" rx="14" fill="#0a2a1d" stroke="rgba(120,200,160,.35)"/>
    <text x="190" y="248" text-anchor="middle" fill="#53f39d" font-size="18" font-weight="700">Ollama</text>
    <text x="190" y="280" text-anchor="middle" fill="#bfe9d3" font-size="12" font-family="monospace">qwen2.5-coder</text>
    <text x="190" y="300" text-anchor="middle" fill="#bfe9d3" font-size="12" font-family="monospace">:1.5b · CPU</text>
    <text x="190" y="326" text-anchor="middle" fill="#9cc7b3" font-size="11" font-family="monospace">:11434</text>
  </g>
  <line x1="302" y1="280" x2="386" y2="280" stroke="#53f39d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- OllaBridge -->
  <g>
    <rect x="390" y="210" width="220" height="140" rx="14" fill="#0a2a1d" stroke="rgba(120,200,160,.35)"/>
    <text x="500" y="248" text-anchor="middle" fill="#53f39d" font-size="18" font-weight="700">OllaBridge</text>
    <text x="500" y="280" text-anchor="middle" fill="#bfe9d3" font-size="12" font-family="monospace">OpenAI-compatible</text>
    <text x="500" y="300" text-anchor="middle" fill="#bfe9d3" font-size="12" font-family="monospace">/v1 gateway</text>
    <text x="500" y="326" text-anchor="middle" fill="#9cc7b3" font-size="11" font-family="monospace">:11435</text>
  </g>
  <line x1="612" y1="280" x2="696" y2="280" stroke="#53f39d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- GitPilot -->
  <g>
    <rect x="700" y="210" width="220" height="140" rx="14" fill="#0d3524" stroke="rgba(120,200,160,.55)"/>
    <text x="810" y="244" text-anchor="middle" fill="#53f39d" font-size="18" font-weight="700">GitPilot</text>
    <text x="810" y="272" text-anchor="middle" fill="#bfe9d3" font-size="11" font-family="monospace">Explorer · Planner</text>
    <text x="810" y="292" text-anchor="middle" fill="#bfe9d3" font-size="11" font-family="monospace">Coder · Reviewer</text>
    <text x="810" y="326" text-anchor="middle" fill="#7dffd0" font-size="11" font-family="monospace">governed by mb</text>
  </g>
  <line x1="922" y1="280" x2="1006" y2="280" stroke="#53f39d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- result -->
  <g>
    <rect x="1010" y="222" width="86" height="116" rx="12" fill="#0d3524" stroke="rgba(120,200,160,.55)"/>
    <text x="1053" y="268" text-anchor="middle" fill="#7dffd0" font-size="26">⚛</text>
    <text x="1053" y="298" text-anchor="middle" fill="#bfe9d3" font-size="11" font-family="monospace">React</text>
    <text x="1053" y="316" text-anchor="middle" fill="#bfe9d3" font-size="11" font-family="monospace">app</text>
  </g>

  <text x="48" y="428" fill="#7fb8a0" font-size="14" font-family="monospace">~9 min build · peak 2.8 GB · 5/5 batches approved · $0.00 · nothing leaves the board</text>
  <text x="48" y="456" fill="#5f9a82" font-size="13" font-family="monospace">no Pi? docker compose caps your laptop at 4 cores / 4GB — native speed, no QEMU</text>
</svg>
