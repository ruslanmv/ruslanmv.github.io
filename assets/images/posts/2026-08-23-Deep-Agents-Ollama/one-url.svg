<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img"
     aria-label="A deep agent talks to one OpenAI-compatible URL on localhost port 11435. Behind it, four backends: Ollama on this laptop, a desktop GPU upstairs, a Colab GPU, and a hosted provider key. The three remote backends dial out to the gateway over WebSockets, so no port forwarding is needed.">
  <title>One OpenAI-compatible URL in front of every model you can reach</title>
  <style>
    :root, svg {
      --ink:    #16182b;
      --muted:  #6b7280;
      --border: #e3e5ee;
      --panel:  #f6f7fb;
      --accent: #4f46e5;
      --accent-s:#6366f1;
      --fill:   #dfe2f7;
      --good:   #067647;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --ink:    #e9eaf3;
        --muted:  #a0a4b8;
        --border: #33364d;
        --panel:  #191b2b;
        --accent: #8b8bf5;
        --accent-s:#a5a5f7;
        --fill:   #2c3060;
        --good:   #47cd89;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h    { font-size: 15px; font-weight: 650; fill: var(--ink); }
    .sub  { font-size: 12.5px; fill: var(--muted); }
    .lbl  { font-size: 11px; fill: var(--muted); }
    .chip { font-size: 12px; font-weight: 550; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; fill: var(--accent); }
    .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.25; rx: 12; }
    .node { fill: var(--panel); stroke: var(--border); stroke-width: 1.25; rx: 10; }
  </style>

  <text class="h"   x="24" y="28">One front door</text>
  <text class="sub" x="24" y="49">Your code changes nothing. The models can live anywhere.</text>

  <!-- ============ your agent ============ -->
  <rect class="card" x="20" y="140" width="160" height="96"/>
  <text class="h"    x="100" y="176" text-anchor="middle" font-size="14">Your deep agent</text>
  <text class="lbl"  x="100" y="198" text-anchor="middle">deepagents + LangChain</text>
  <text class="lbl"  x="100" y="216" text-anchor="middle">speaks the OpenAI API</text>

  <!-- arrow to gateway -->
  <g stroke="var(--accent)" stroke-width="1.8" fill="none">
    <path d="M180 188 L246 188"/>
    <path d="M238 183 L246 188 L238 193"/>
  </g>

  <!-- ============ the gateway ============ -->
  <rect x="250" y="128" width="196" height="120" rx="12"
        fill="var(--fill)" stroke="var(--accent)" stroke-width="1.6"/>
  <text class="h"    x="348" y="160" text-anchor="middle">OllaBridge</text>
  <text class="mono" x="348" y="182" text-anchor="middle">localhost:11435/v1</text>
  <text class="lbl"  x="348" y="206" text-anchor="middle">one URL for all of them</text>
  <text class="lbl"  x="348" y="226" text-anchor="middle">routes each request</text>

  <!-- ============ backends ============ -->
  <!-- 1. local -->
  <rect class="node" x="530" y="72" width="230" height="52"/>
  <text class="chip" x="546" y="94">Ollama, this laptop</text>
  <text class="lbl"  x="546" y="112">qwen3:8b on the 4080</text>

  <!-- 2. desktop -->
  <rect class="node" x="530" y="136" width="230" height="52"/>
  <text class="chip" x="546" y="158">The GPU upstairs</text>
  <text class="lbl"  x="546" y="176">a bigger model, same URL</text>

  <!-- 3. colab -->
  <rect class="node" x="530" y="200" width="230" height="52"/>
  <text class="chip" x="546" y="222">A Colab GPU</text>
  <text class="lbl"  x="546" y="240">borrowed for an afternoon</text>

  <!-- 4. hosted -->
  <rect class="node" x="530" y="264" width="230" height="52"/>
  <text class="chip" x="546" y="286">Your own provider key</text>
  <text class="lbl"  x="546" y="304">for the jobs an 8B can't do</text>

  <!-- gateway to backends: solid = requests out -->
  <g stroke="var(--accent-s)" stroke-width="1.5" fill="none" opacity=".9">
    <path d="M446 172 C486 172 486 98 526 98"/>
    <path d="M518 93 L526 98 L518 103"/>
    <path d="M446 182 L526 182"/>
    <path d="M518 177 L526 182 L518 187"/>
    <path d="M446 192 C486 192 486 226 526 226"/>
    <path d="M518 221 L526 226 L518 231"/>
    <path d="M446 202 C486 202 486 290 526 290"/>
    <path d="M518 285 L526 290 L518 295"/>
  </g>

  <!-- dial-out arrow, drawn under the stack -->
  <g stroke="var(--good)" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <path d="M645 316 L645 342 L348 342 L348 252"/>
  </g>
  <g stroke="var(--good)" stroke-width="1.5" fill="none">
    <path d="M343 260 L348 252 L353 260"/>
  </g>
  <text class="lbl" x="478" y="333" text-anchor="middle" fill="var(--good)">nodes dial out — no port forwarding, no VPN</text>

  <text class="sub" x="24" y="376">Point the agent at the gateway once, and the same code runs against any of them.</text>
</svg>
