<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img"
     aria-label="On the left, the middleware stack in order: Filesystem, SubAgent, Summarization and PatchToolCalls are built in, your middleware is spliced in after them as Extra, and AnthropicPromptCaching is the tail. Entries lower in the list sit closer to the model. On the right, wrap_tool_call receives the request and a handler: call the handler and the tool runs, or return a ToolMessage instead and the tool never runs at all.">
  <title>Where your middleware sits, and what wrap_tool_call can do</title>
  <style>
    :root, svg {
      --ink:    #16182b;
      --muted:  #6b7280;
      --border: #e3e5ee;
      --panel:  #f6f7fb;
      --accent: #4f46e5;
      --fill:   #dfe2f7;
      --warn:   #d92d20;
      --warnbg: #fdeceb;
      --good:   #067647;
      --goodbg: #e6f4ec;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --ink:    #e9eaf3;
        --muted:  #a0a4b8;
        --border: #33364d;
        --panel:  #191b2b;
        --accent: #8b8bf5;
        --fill:   #2c3060;
        --warn:   #f97066;
        --warnbg: #3a1d1d;
        --good:   #47cd89;
        --goodbg: #14301f;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h    { font-size: 15px; font-weight: 650; fill: var(--ink); }
    .sub  { font-size: 12.5px; fill: var(--muted); }
    .lbl  { font-size: 11px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; fill: var(--ink); }
    .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.25; rx: 14; }
    .row  { rx: 6; stroke: var(--border); stroke-width: 1.1; fill: var(--panel); }
  </style>

  <!-- ================= LEFT: the stack ================= -->
  <rect class="card" x="20" y="20" width="356" height="380"/>
  <text class="h"   x="44" y="50">The stack, in order</text>
  <text class="sub" x="44" y="71">Yours is spliced in — not bolted on top.</text>

  <g>
    <rect class="row" x="44" y="90"  width="252" height="30"/>
    <text class="mono" x="58" y="109">FilesystemMiddleware</text>

    <rect class="row" x="44" y="126" width="252" height="30"/>
    <text class="mono" x="58" y="145">SubAgentMiddleware</text>

    <rect class="row" x="44" y="162" width="252" height="30"/>
    <text class="mono" x="58" y="181">SummarizationMiddleware</text>

    <rect class="row" x="44" y="198" width="252" height="30"/>
    <text class="mono" x="58" y="217">PatchToolCallsMiddleware</text>

    <!-- yours -->
    <rect x="44" y="234" width="252" height="30" rx="6"
          fill="var(--fill)" stroke="var(--accent)" stroke-width="1.6"/>
    <text class="mono" x="58" y="253" fill="var(--accent)">Extra — yours</text>

    <rect class="row" x="44" y="270" width="252" height="30"/>
    <text class="mono" x="58" y="289">AnthropicPromptCaching…</text>
  </g>

  <!-- closer-to-the-model arrow -->
  <g stroke="var(--muted)" stroke-width="1.4" fill="none">
    <path d="M336 96 L336 292"/>
    <path d="M331 284 L336 292 L341 284"/>
  </g>
  <text class="lbl" x="352" y="200" transform="rotate(90 352 200)"
        text-anchor="middle">closer to the model</text>

  <text class="sub" x="44" y="330">Reusing an existing name replaces that</text>
  <text class="sub" x="44" y="348">entry in place, keeping its position — how</text>
  <text class="sub" x="44" y="366">you swap out the built-in compaction.</text>

  <!-- ================= RIGHT: wrap_tool_call ================= -->
  <rect class="card" x="396" y="20" width="364" height="380"/>
  <text class="h"    x="420" y="50">What a wrapper can do</text>
  <text class="mono" x="420" y="74" fill="var(--accent)">wrap_tool_call(request, handler)</text>

  <!-- the model's request -->
  <rect x="420" y="98" width="316" height="42" rx="8"
        fill="var(--fill)" stroke="var(--border)" stroke-width="1.1"/>
  <text class="lbl"  x="434" y="116">the model asks for</text>
  <text class="mono" x="434" y="132">delete("/billing.py")</text>

  <!-- fork -->
  <g stroke="var(--border)" stroke-width="1.4" fill="none">
    <path d="M500 140 L500 176"/>
    <path d="M656 140 L656 176"/>
  </g>

  <!-- allow branch -->
  <rect x="420" y="182" width="152" height="86" rx="10"
        fill="var(--goodbg)" stroke="var(--good)" stroke-width="1.2"/>
  <text class="mono" x="434" y="204" fill="var(--good)">handler(request)</text>
  <text class="lbl"  x="434" y="222">you call it</text>
  <text class="lbl"  x="434" y="240">the tool runs</text>
  <text class="lbl"  x="434" y="256">you time the result</text>

  <!-- refuse branch -->
  <rect x="584" y="182" width="152" height="86" rx="10"
        fill="var(--warnbg)" stroke="var(--warn)" stroke-width="1.2"/>
  <text class="mono" x="598" y="204" fill="var(--warn)">ToolMessage(…)</text>
  <text class="lbl"  x="598" y="222">you don't call it</text>
  <text class="lbl"  x="598" y="240">the tool never runs</text>
  <text class="lbl"  x="598" y="256">your text is the result</text>

  <!-- back to the loop -->
  <g stroke="var(--border)" stroke-width="1.4" fill="none">
    <path d="M496 268 L496 300 L660 300 L660 268"/>
  </g>
  <rect x="470" y="312" width="216" height="34" rx="8"
        fill="var(--panel)" stroke="var(--border)" stroke-width="1.1"/>
  <text class="lbl" x="578" y="333" text-anchor="middle">either way, the loop continues</text>

  <text class="sub" x="420" y="376">Not calling the handler is the whole guardrail.</text>
</svg>
