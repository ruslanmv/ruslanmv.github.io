<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <title>Deep Agents on Your Own GPU — post banner</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0a0c18"/>
      <stop offset=".45" stop-color="#111536"/>
      <stop offset="1"   stop-color="#0c1026"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="22%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="82%" r="52%">
      <stop offset="0" stop-color="#3ddc97" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="62%" cy="16%" r="34%">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".085"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".028"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".30"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#6366f1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".032" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      .eyebrow { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 17px;
                 font-weight: 600; letter-spacing: 4.6px; fill: #3ddc97; }
      .h1   { font-family: Inter, system-ui, sans-serif; font-weight: 800; font-size: 82px;
              fill: #ffffff; letter-spacing: -2.4px; }
      .h1b  { font-family: Inter, system-ui, sans-serif; font-weight: 800; font-size: 82px;
              fill: url(#mint); letter-spacing: -2.4px; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16.5px;
              fill: #aab0d4; }
      .cardTitle { font-family: Inter, system-ui, sans-serif; font-weight: 700; font-size: 20px;
                   fill: #ffffff; }
      .cardSub   { font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 14.5px;
                   fill: #98a0c8; }
      .tag  { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px;
              fill: #8f97c4; }
      .band { font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 15px;
              fill: #b9c0e4; letter-spacing: .3px; }
      .chiplbl { font-family: Inter, system-ui, sans-serif; font-weight: 800; font-size: 15px;
                 fill: #cdd3f2; letter-spacing: 1.6px; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1600" height="600" fill="url(#ground)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <rect width="1600" height="600" fill="url(#glowA)"/>
  <rect width="1600" height="600" fill="url(#glowB)"/>
  <rect width="1600" height="600" fill="url(#glowC)"/>

  <!-- ================= LEFT: the wordmark ================= -->
  <g>
    <text class="eyebrow" x="96" y="176">HANDS-ON LAB</text>
    <text class="h1"  x="94" y="262">Deep Agents</text>
    <text class="h1b" x="94" y="344">on your GPU</text>

    <rect x="98" y="392" width="72" height="3" rx="1.5" fill="url(#mint)"/>

    <text class="mono" x="96" y="440">deepagents · ollama · uv</text>
    <text class="mono" x="96" y="466" fill="#7d85b0">qwen3:8b @ 24576 ctx · RTX 4080 Laptop</text>
  </g>

  <!-- ================= RIGHT: the architecture ================= -->
  <!-- orchestrator -->
  <g>
    <ellipse cx="838" cy="196" rx="96" ry="52" fill="#6366f1" opacity=".30" filter="url(#softer)"/>
    <rect x="742" y="150" width="196" height="92" rx="16"
          fill="url(#cardFill)" stroke="#8b93f8" stroke-opacity=".55" stroke-width="1.4"/>
    <circle cx="768" cy="180" r="4.5" fill="#3ddc97"/>
    <text class="cardTitle" x="784" y="186">Orchestrator</text>
    <text class="cardSub"   x="766" y="214">one clear head</text>
    <text class="tag"       x="766" y="232" fill="#3ddc97">14 messages</text>
  </g>

  <!-- three sub-agents -->
  <g>
    <rect x="1074" y="118" width="228" height="62" rx="13"
          fill="url(#cardFill)" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.2"/>
    <text class="cardTitle" x="1096" y="146" font-size="17">sub-agent</text>
    <text class="tag"       x="1096" y="166">blank context · vLLM</text>

    <rect x="1074" y="192" width="228" height="62" rx="13"
          fill="url(#cardFill)" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.2"/>
    <text class="cardTitle" x="1096" y="220" font-size="17">sub-agent</text>
    <text class="tag"       x="1096" y="240">blank context · SGLang</text>

    <rect x="1074" y="266" width="228" height="62" rx="13"
          fill="url(#cardFill)" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.2"/>
    <text class="cardTitle" x="1096" y="294" font-size="17">sub-agent</text>
    <text class="tag"       x="1096" y="314">blank context · TensorRT</text>
  </g>

  <!-- delegation arcs -->
  <g fill="none" stroke="#8b93f8" stroke-opacity=".55" stroke-width="1.6">
    <path d="M938 178 C1006 178 1006 149 1068 149"/>
    <path d="M938 196 C1006 196 1006 223 1068 223"/>
    <path d="M938 214 C1006 262 1006 297 1068 297"/>
  </g>
  <g fill="#8b93f8" opacity=".8">
    <path d="M1062 144 l10 5 -10 5 z"/>
    <path d="M1062 218 l10 5 -10 5 z"/>
    <path d="M1062 292 l10 5 -10 5 z"/>
  </g>
  <text class="tag" x="1000" y="128" text-anchor="middle" fill="#a7aef0">task()</text>

  <!-- shared filesystem band -->
  <g>
    <rect x="742" y="382" width="560" height="72" rx="14"
          fill="#ffffff" fill-opacity=".035"
          stroke="#3ddc97" stroke-opacity=".45" stroke-width="1.3" stroke-dasharray="7 6"/>
    <text class="band" x="1022" y="412" text-anchor="middle">shared virtual filesystem</text>
    <text class="tag"  x="1022" y="436" text-anchor="middle">/notes_1.md · /notes_2.md · /notes_3.md · /report.md</text>
  </g>
  <g stroke="#3ddc97" stroke-opacity=".4" stroke-width="1.3" fill="none">
    <path d="M840 246 L840 378"/>
    <path d="M1188 330 L1188 378"/>
  </g>

  <!-- GPU chip motif, bottom right -->
  <g transform="translate(1330 372)">
    <rect x="0" y="0" width="140" height="140" rx="18" fill="url(#chip)"
          stroke="#8b93f8" stroke-opacity=".45" stroke-width="1.4"/>
    <rect x="26" y="26" width="88" height="88" rx="10" fill="#0b0e20" fill-opacity=".55"
          stroke="#3ddc97" stroke-opacity=".4" stroke-width="1.2"/>
    <text class="chiplbl" x="70" y="77" text-anchor="middle">GPU</text>
    <text class="tag" x="70" y="96" text-anchor="middle" font-size="11">12 GB</text>
    <g stroke="#8b93f8" stroke-opacity=".5" stroke-width="2.6" stroke-linecap="round">
      <path d="M34 -12 v12"/><path d="M58 -12 v12"/><path d="M82 -12 v12"/><path d="M106 -12 v12"/>
      <path d="M34 140 v12"/><path d="M58 140 v12"/><path d="M82 140 v12"/><path d="M106 140 v12"/>
      <path d="M-12 34 h12"/><path d="M-12 58 h12"/><path d="M-12 82 h12"/><path d="M-12 106 h12"/>
      <path d="M140 34 h12"/><path d="M140 58 h12"/><path d="M140 82 h12"/><path d="M140 106 h12"/>
    </g>
  </g>

  <!-- a hairline that ties the composition together -->
  <rect x="0" y="596" width="1600" height="4" fill="url(#fade)"/>
</svg>
